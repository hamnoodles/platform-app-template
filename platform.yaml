# yaml-language-server: $schema=./.platform/platform.schema.json
---
#
# The app's manifest: what the platform provides for it. Lines marked "change:" are yours to
# edit; read the docs before changing anything else:
# https://github.com/shirtracer/platform-workflows/tree/v1/docs

# change: your app name: lower-case letters and digits, starting with a letter, at most 31
# characters, no "-". It names the route, database, Redis user, buckets and services.
name: myapp # change: app name

# The route is https://<name>.apps.<server domain> (server apps: platform.shirtracer.gmbh). An
# explicit domain depends on the server (docs/servers.md): on the apps server the admin allows it
# in the server's registry first; on the shops server any free domain works. certificate: true
# requests a certificate for it once its DNS points at the server (default false: the server's
# default certificate, e.g. behind a CDN).
# domain: shop.example.com
# certificate: true

# On the apps server the platform answers only requests from Germany, Austria, Switzerland,
# Luxembourg and the Netherlands (the shops server has no geo-filter for now). Paths that foreign
# services must call (webhooks) can be opened, each with everything below it; never "/". Only for
# paths the app serves without the platform login (they check their own signature). Docs:
# docs/operations.md, "Access from abroad".
# abroad_paths: [/webhooks/stripe]

# forward: the platform login (Authentik) runs before every request (default).
# oidc:    the app logs users in itself with the platform's OIDC client (OIDC_CLIENT_* files).
# none:    no platform login: public, or the app brings its own authentication.
auth: forward # change: forward | oidc | none

# Who may use the app (forward and oidc; leave out with auth none). Groups named <name>-<suffix>
# are created for the app and their members managed by the managers below in the platform's
# Authentik UI; other names are existing groups (access only). Unknown names fail the deploy.
access: # change: your groups and managers
  groups: [myapp-users] # change: e.g. [myapp-users, staff]
  managers: [] # change: platform usernames, e.g. [alice]

# The shared services this app uses. Remove a line to stop using a service: access is
# revoked, the data is kept.
services: # change: the services you need
  postgres:
    extensions: [] # change: e.g. [pg_trgm, citext] (allowed list: docs/services.md)
  redis: true
  s3: true
  # Objects can expire: the storage server removes them once their last write is older than
  # expire_days (not reversible there; docs/services.md). Replace "s3: true" with:
  # s3:
  #   lifecycle:
  #     - bucket: myapp # change: myapp or myapp-<suffix>
  #       prefix: exports/ # optional: only objects whose name starts with it
  #       expire_days: 30
  # A message broker vhost <name> (docs/services.md "RabbitMQ"; durable queues survive restarts,
  # messages are not backed up). Defaults: 50 connections, 50 queues, 64 MiB per queue.
  # rabbitmq: true
  # or with your own limits (at most 200 connections, 200 queues, 1 GiB per queue, 8 GiB in all):
  # rabbitmq:
  #   limits: {connections: 50, queues: 20, queue_bytes: 134217728}

# Your own secrets, names only. Values go into the repo's GitHub Environment "production".
secrets: # change: your secret names; list each in deploy/compose.yaml too (2 places)
  - EXAMPLE_API_KEY
